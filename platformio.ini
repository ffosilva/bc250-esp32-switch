; BC250 ESP32 power switch.
; The setup portal's web UI lives in app/index.html and is packed into the
; SPIFFS partition. Flash it with:  pio run -t uploadfs

[platformio]
data_dir = app
default_envs = esp32dev

; Common base config for all targets
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
; Custom table: ~2.75MB app (WiFi + Classic BT + async web server) + SPIFFS for the UI.
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
monitor_speed = 115200
lib_deps =
	https://github.com/ESP32Async/ESPAsyncWebServer
	bblanchon/ArduinoJson@^7

; Target 1: ESP32-WROOM-32 (DevKitC), 4 MB flash
[env:esp32dev]
board = esp32dev
build_flags =
	-D BOARD_ESP32DEV

; Target 2: AI-Thinker ESP32-CAM (ESP-32S module), 4 MB flash
[env:esp32cam]
board = esp32cam
build_flags =
	-D BOARD_ESP32CAM
